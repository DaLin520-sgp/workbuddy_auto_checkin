name: diag-temp
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: token 指纹 + 网关行为
        env:
          WB_ACCESS_TOKEN: ${{ secrets.WB_ACCESS_TOKEN }}
        run: |
          echo "Secret token 长度: ${#WB_ACCESS_TOKEN}"
          echo "Secret token sha256 前16位: $(printf '%s' "$WB_ACCESS_TOKEN" | sha256sum | cut -c1-16)"
          echo "--- 裸请求（无 token）---"
          curl -sS -D - -o /dev/null --max-time 20 -X POST \
            "https://www.workbuddy.cn/v2/billing/meter/checkin-activity-status" \
            -H "Content-Type: application/json" -d '{}' | head -15 || true
          echo "--- 带 token 请求 ---"
          curl -sS -D - -o /dev/null --max-time 20 -X POST \
            "https://www.workbuddy.cn/v2/billing/meter/checkin-activity-status" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            -H "User-Agent: WorkBuddy" \
            -H "Authorization: Bearer $WB_ACCESS_TOKEN" -d '{}' | head -15 || true
